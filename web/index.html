<!doctype html>
<html lang="zh-CN" data-theme="dark" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>闭环轮转 · Loop Rotation — 原型 v0.3</title>
<style>
  /* ── DSH design tokens (from @deepseek-ai/dsh-client-ui-theme, --dsw-*) ── */
  :root{
    --base:#151517; --l1:#1b1b1c; --l2:#232324; --l3:#2c2c2e; --l4:#353638;
    --b1:#ffffff0f; --b2:#ffffff1f; --b3:#ffffff29; --b4:#ffffff33;
    --tx1:#f9fafb; --tx2:#cfd3d6; --tx3:#adb2b8; --tx4:#979da6;
    --hover:#ffffff14; --active:#ffffff24;
    --brand:#5686fe; --brand-2:#4d93f8; --brand-dim:#26324a;
    --blue-300:#93c5fd; --amber:#f7ad31; --green:#4ed17e; --red:#f25a5a;
    --corner:superellipse(1.5);
    --lane-head:224px;
    --info-col:272px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --ease-out:cubic-bezier(.23,1,.32,1);
    --shadow-pop:0 12px 32px -18px rgba(0,0,0,.85);
  }
  html[data-theme="light"]{
    --base:#f5f6f7; --l1:#fbfcfd; --l2:#ffffff; --l3:#f1f3f5; --l4:#e9ecf2;
    --b1:#0000000a; --b2:#0000001a; --b3:#00000029; --b4:#00000033;
    --tx1:#0f1115; --tx2:#43454a; --tx3:#61666b; --tx4:#6f747c;
    --hover:#2631480f; --active:#2631481a;
    --brand:#4176e6; --brand-2:#3b82f6; --brand-dim:#e4edfd;
    --blue-300:#2563eb; --amber:#dd8629; --green:#22c55e; --red:#e04a4a;
    --shadow-pop:0 12px 30px -20px rgba(16,24,40,.3);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--tx1);background:var(--base);font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* ───────── shell ───────── */
  .app{display:flex;flex-direction:column;height:100vh}
  .topbar{display:flex;align-items:center;gap:16px;padding:0 16px;height:52px;flex:0 0 52px;border-bottom:1px solid var(--b2)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .mark{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;corner-shape:var(--corner);background:var(--l2);border:1px solid var(--b2)}
  .mark svg{width:15px;height:15px;stroke:var(--brand-2)}
  .brand h1{margin:0;font-size:13.5px;font-weight:500}
  .brand p{margin:0;font-size:10.5px;color:var(--tx4);letter-spacing:.06em}
  .grow{flex:1 1 auto}
  .seg{display:flex;padding:2px;gap:2px;background:var(--l2);border:1px solid var(--b2);border-radius:9px;corner-shape:var(--corner)}
  .seg button{padding:4px 12px;border-radius:7px;corner-shape:var(--corner);font-size:12.5px;color:var(--tx3);
    transition:color 160ms var(--ease-out),background-color 160ms var(--ease-out),transform 160ms var(--ease-out)}
  .seg button[aria-pressed="true"]{color:var(--tx1);background:var(--l4)}
  .seg button:active{transform:scale(.97)}
  .meta-strip{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--tx4)}
  .meta-strip .kpi{display:flex;align-items:center;gap:6px}
  .meta-strip b{color:var(--tx2);font-weight:500}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--tx4);flex:0 0 auto}
  .dot.doing{background:var(--brand-2)} .dot.blocked{background:var(--red)}
  .dot.done{background:var(--green)} .dot.review{background:var(--amber)} .dot.ready{background:var(--tx3)}
  .iconbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;corner-shape:var(--corner);
    border:1px solid var(--b2);background:var(--l2);color:var(--tx3);font-size:12px;
    transition:color 160ms var(--ease-out),background-color 160ms var(--ease-out),transform 160ms var(--ease-out)}
  .iconbtn:hover{color:var(--tx1);background:var(--l3)}
  .iconbtn:active{transform:scale(.97)}
  .iconbtn svg{width:13px;height:13px}

  /* ───────── toolbar ───────── */
  .toolbar{display:flex;align-items:center;gap:10px;padding:8px 16px;flex:0 0 auto;border-bottom:1px solid var(--b1);background:var(--l1)}
  .chipbar{display:flex;gap:6px;align-items:center}
  .chip{height:26px;padding:0 10px;border-radius:7px;corner-shape:var(--corner);font-size:12px;color:var(--tx3);
    border:1px solid var(--b2);background:transparent;
    transition:color 160ms var(--ease-out),background-color 160ms var(--ease-out),border-color 160ms var(--ease-out),transform 160ms var(--ease-out)}
  .chip:hover{color:var(--tx1);background:var(--hover)}
  .chip[aria-pressed="true"]{color:var(--tx1);background:var(--brand-dim);border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
  .chip:active{transform:scale(.97)}
  .hint{font-size:11.5px;color:var(--tx4)}

  /* ───────── matrix ───────── */
  .scroll{flex:1 1 auto;overflow:auto;scrollbar-color:var(--l4) transparent;scrollbar-width:thin}
  .matrix{display:grid;grid-template-columns:var(--lane-head) repeat(4,minmax(228px,1fr)) var(--info-col);min-width:1440px;row-gap:12px}
  .stage-head{position:sticky;top:0;z-index:6;padding:10px 14px 9px;display:flex;align-items:center;gap:8px;
    background:var(--base);border-bottom:1px solid var(--b2);font-size:12px}
  .stage-head.corner{color:var(--tx4);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
  .stage-head .swatch{width:6px;height:6px;border-radius:2px;background:var(--c);transform:rotate(45deg)}
  .stage-head .label{color:var(--tx2);font-weight:500}
  .stage-head .en{margin-left:auto;color:var(--tx4);font-size:10px;letter-spacing:.08em;text-transform:uppercase}

  .lane{grid-column:1/-1;display:grid;grid-template-columns:var(--lane-head) 1fr var(--info-col);position:relative;
    background:var(--l1);border:1px solid var(--b2);border-bottom:2px solid var(--b3);border-radius:9px;
    box-shadow:0 1px 0 #00000059}
  .lane[data-active="true"]{background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 7%,var(--l1)),var(--l1) 26%)}
  .lane[data-converged="true"]{background:linear-gradient(90deg,color-mix(in srgb,var(--green) 8%,var(--l1)),var(--l1) 26%)}
  .lane-head{padding:14px 12px 14px 14px;display:flex;flex-direction:column;gap:6px;
    border-right:1px solid var(--b2);position:sticky;left:0;z-index:7;background:inherit;
    border-radius:9px 0 0 9px}
  .lane-name{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--tx1)}
  .lane-x{margin-left:auto;width:16px;height:16px;line-height:14px;border-radius:4px;border:1px solid transparent;
    background:transparent;color:var(--tx4);font-size:10px;opacity:0;transition:opacity 140ms var(--ease-out),color 140ms var(--ease-out)}
  .lane:hover .lane-x{opacity:1}
  .lane-x:hover{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
  .lane-tag{font-size:10.5px;color:var(--tx4);letter-spacing:.04em}
  .lane-prog{margin-top:2px;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx4)}
  .lane-actions{display:flex;gap:5px;margin-top:4px}
  .mini{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 8px;border-radius:6px;corner-shape:var(--corner);
    border:1px solid var(--b2);color:var(--tx3);font-size:11.5px;background:var(--l2);
    transition:color 160ms var(--ease-out),background-color 160ms var(--ease-out),transform 160ms var(--ease-out)}
  .mini:hover{color:var(--tx1);background:var(--l3)}
  .mini:active{transform:scale(.97)}

  .canvas{position:relative;min-height:96px;padding:10px 0 14px}
  .canvas--collapsed{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:0;padding:11px 14px}
  .gchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;corner-shape:var(--corner);
    border:1px solid var(--b2);background:var(--l2);font-size:11.5px;color:var(--tx2);
    transition:border-color 160ms var(--ease-out),background-color 160ms var(--ease-out)}
  .gchip:hover{border-color:var(--b3)}
  .gchip i{width:5px;height:5px;border-radius:50%;background:var(--tone);flex:0 0 auto}
  .gchip small{color:var(--tx4);font-size:10px}
  .gchip[data-closed="true"]{opacity:.62}
  .gchip[data-closed="true"] span{text-decoration:line-through}
  .gchip.add{color:var(--tx4);border-style:dashed;background:transparent}
  .edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
  .edges path{fill:none;stroke:var(--edge,var(--b3));stroke-width:var(--ew,1.2);stroke-linecap:round;stroke-linejoin:round;opacity:.8;
    transition:opacity 160ms var(--ease-out)}
  .edges path.trunk{opacity:.55}
  .edges path.done{opacity:.4}
  .edges path.blocked{stroke:var(--red);opacity:.95}
  .edges circle.j{opacity:.9}

  /* ───────── 信息 / 操作列 ───────── */
  .info{border-left:1px solid var(--b2);background:color-mix(in srgb,var(--l1) 70%,var(--base));
    padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;min-width:0}
  .info-sec{display:flex;flex-direction:column;gap:5px}
  .info-k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx4)}
  .info-row{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--tx3);min-width:0}
  .info-row b{margin-left:auto;color:var(--tx1);font-weight:500;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .info-row .d{width:5px;height:5px;border-radius:50%;background:var(--tone);flex:0 0 auto}
  .ibar{height:4px;border-radius:2px;background:var(--b2);overflow:hidden;display:flex}
  .ibar i{display:block;height:100%;background:var(--green)}
  .ibar i.b{background:var(--red)}
  .ibar i.w{background:var(--brand-2)}
  .health{display:flex;align-items:center;gap:8px}
  .health .num{font-size:19px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums;color:var(--tone)}
  .health .cap{font-size:10px;color:var(--tx4);line-height:1.3}
  .info-acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
  .info-empty{font-size:11px;color:var(--tx4)}
  .eta{font-size:11.5px;color:var(--tx2)}
  .trend{width:100%;height:58px;display:block;margin:2px 0 1px}
  .trend .tlab{fill:var(--tx4);font-size:7px;letter-spacing:.02em}
  .eta em{font-style:normal;color:var(--amber)}

  /* ───────── tree node ───────── */
  .tnode{position:absolute;z-index:2;border-radius:9px;corner-shape:var(--corner);border:1px solid var(--b1);
    background:var(--l2);padding:7px 9px 0 11px;overflow:hidden;
    transition:border-color 160ms var(--ease-out),background-color 160ms var(--ease-out),transform 160ms var(--ease-out)}
  .tnode::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--tone);opacity:.9}
  @media (hover:hover) and (pointer:fine){ .tnode:hover{border-color:var(--b3)} }
  .tnode[data-state="blocked"]{border-color:color-mix(in srgb,var(--red) 42%,var(--b1));background:color-mix(in srgb,var(--red) 7%,var(--l2))}
  .tnode[data-state="ready-close"]{border-color:color-mix(in srgb,var(--amber) 45%,var(--b1))}
  .tnode[data-state="closed"]{opacity:.62}
  .tnode[data-state="converged"]{border-color:color-mix(in srgb,var(--green) 45%,var(--b1));background:color-mix(in srgb,var(--green) 7%,var(--l2))}
  .tnode-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  .kind{font-size:9.5px;letter-spacing:.06em;color:var(--tone);text-transform:uppercase}
  .nid{font-size:9.5px;color:var(--tx4);letter-spacing:.03em}
  .st{margin-left:auto;font-size:10px;padding:0 5px;border-radius:5px;line-height:16px;white-space:nowrap;
    color:var(--st-tone,var(--tx3));background:color-mix(in srgb,var(--st-tone,var(--tx3)) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--st-tone,var(--tx3)) 24%,transparent)}
  .tnode-title{font-size:12.5px;line-height:1.42;color:var(--tx1);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tnode-meta{margin-top:3px;font-size:10.5px;color:var(--tx4);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .bars{display:inline-flex;gap:2px}
  .bars i{width:10px;height:3px;border-radius:2px;background:var(--b3)}
  .bars i.on{background:var(--green)}
  .blk{font-size:10.5px;color:var(--red)}
  .foldchip{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;margin-top:5px;margin-bottom:5px;
    height:20px;padding:0 7px;border-radius:5px;corner-shape:var(--corner);border:1px dashed var(--b2);
    background:transparent;color:var(--tx4);font-size:10px;transition:color 140ms var(--ease-out),border-color 140ms var(--ease-out)}
  .foldchip:hover{color:var(--tx2);border-color:var(--b3)}
  .foldchip.on{border-style:solid;color:var(--tx3)}
  .runbad{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--tone);
    padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--tone) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--tone) 26%,transparent)}
  .runbad .rdot{width:4px;height:4px;border-radius:50%;background:var(--tone)}
  .lsel{display:flex;flex-direction:column;gap:2px}
  .lopt{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;font-size:12px;color:var(--tx2);cursor:pointer}
  .lopt:hover{background:var(--hover)}
  .lopt input{accent-color:var(--brand)}
  .late{font-size:10.5px;color:var(--amber)}
  .folded{margin-top:5px;display:flex;flex-direction:column;gap:2px;border-left:1px dashed var(--b2);padding-left:7px}
  .frow{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--tx3);min-width:0}
  .fdot{width:5px;height:5px;border-radius:50%;background:var(--tone);flex:0 0 auto}
  .ftitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fst{margin-left:auto;color:var(--tx4);font-size:9.5px}
  .fbtn{margin-left:auto;height:16px;padding:0 5px;border-radius:4px;border:1px solid var(--b2);color:var(--tx4);font-size:10px}
  .fbtn:hover{color:var(--tx1);border-color:var(--b3)}
  .issues{margin-top:5px;display:flex;flex-direction:column;gap:3px}
  .issue{font-size:10.5px;color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent);
    border-left:2px solid var(--red);padding:2px 6px;border-radius:0 4px 4px 0;line-height:1.35}
  .tfoot{margin-top:6px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .tbtn{height:21px;padding:0 7px;border-radius:5px;corner-shape:var(--corner);border:1px solid var(--b2);
    background:var(--l3);color:var(--tx2);font-size:11px;
    transition:background-color 160ms var(--ease-out),color 160ms var(--ease-out),transform 160ms var(--ease-out)}
  .tbtn:hover{background:var(--l4);color:var(--tx1)}
  .tbtn:active{transform:scale(.96)}
  .tbtn.primary{background:color-mix(in srgb,var(--amber) 18%,transparent);border-color:color-mix(in srgb,var(--amber) 40%,transparent);color:var(--amber)}
  .tbtn.primary-converge{background:color-mix(in srgb,var(--green) 18%,transparent);border-color:color-mix(in srgb,var(--green) 40%,transparent);color:var(--green)}
  .tbtn.ghost{background:transparent;border-style:dashed;color:var(--tx4)}
  .tbtn.ghost:hover{color:var(--tx2)}
  .tfootline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin:7px -9px 0 -11px;padding:5px 9px 6px 11px;
    border-top:1px solid var(--b1);background:color-mix(in srgb,var(--bg-base) 34%,transparent);border-radius:0 0 8px 8px}

  /* ───────── 已收敛区 ───────── */
  .archive{grid-column:1/-1;border-top:1px solid var(--b2);background:var(--panel-3,var(--base));padding:0}
  .archive-head{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--tx4);background:var(--base);border-bottom:1px solid var(--b1)}
  .archive-head .n{color:var(--tx3);letter-spacing:0;text-transform:none}
  .archive-head .grow{flex:1}
  .archive-list{padding:6px 10px 12px;display:flex;flex-direction:column;gap:1px}
  .archive-row{display:grid;grid-template-columns:22px 170px 1fr 150px 150px auto;align-items:center;gap:10px;
    padding:9px 12px;border-radius:8px;corner-shape:var(--corner);border:1px solid transparent;text-align:left;
    transition:background-color 160ms var(--ease-out),border-color 160ms var(--ease-out)}
  .archive-row:hover{background:var(--hover);border-color:var(--b1)}
  .archive-row .check{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
    background:color-mix(in srgb,var(--green) 16%,transparent);border:1px solid color-mix(in srgb,var(--green) 42%,transparent);
    color:var(--green);font-size:10px}
  .archive-row .nm{font-size:12.5px;color:var(--tx2)}
  .archive-row .lp{font-size:12.5px;color:var(--tx1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .archive-row .mt{font-size:11px;color:var(--tx4);font-variant-numeric:tabular-nums}
  .archive-row .acts{display:flex;gap:5px;justify-self:end}
  .archive-empty{padding:10px 16px 14px;font-size:11.5px;color:var(--tx4)}

  /* ───────── 第一列统计块 ───────── */
  .lane-time{margin-top:auto;padding-top:10px;border-top:1px solid var(--b1);display:flex;flex-direction:column;gap:4px}
  .lane-time .info-row{font-size:11px}
  .lane-time .info-row b{font-size:11.5px}
  .lane-time .info-k{margin-bottom:2px}
  .lane-stats{display:flex;flex-direction:column;gap:8px}

  /* ───────── 服务（第一列，项目名下方） ───────── */
  .lane-svc{margin-top:8px;padding-top:8px;border-top:1px solid var(--b1);display:flex;flex-direction:column;gap:4px}
  .lane-svc .svc{margin-bottom:0;padding:5px 6px;background:color-mix(in srgb,var(--l2) 70%,transparent)}
  .lane-svc .svc-name{font-size:11px}
  .lane-svc .svc-url{font-size:10px;padding:0 0 2px}
  .lane-svc .svc-acts{gap:3px}
  .lane-svc .pbtn{height:19px;padding:0 6px;font-size:10px}

  /* ───────── 服务（兼容信息列） ───────── */
  .lane-svc{margin-top:8px;padding-top:8px;border-top:1px solid var(--b1);display:flex;flex-direction:column;gap:4px}
  .lane-svc .svc{margin-bottom:0;padding:5px 6px;background:color-mix(in srgb,var(--l2) 70%,transparent)}
  .lane-svc .svc-name{font-size:11px}
  .lane-svc .svc-url{font-size:10px;padding:0 0 2px}
  .lane-svc .svc-acts{gap:3px}
  .lane-svc .pbtn{height:19px;padding:0 6px;font-size:10px}
  .svc{border:1px solid var(--b1);border-radius:7px;padding:6px 7px;margin-bottom:5px;background:var(--l2)}
  .svc-top{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx2)}
  .svc-dot{width:6px;height:6px;border-radius:50%;background:var(--tone);flex:0 0 auto}
  .svc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .svc-st{margin-left:auto;font-size:10px;flex:0 0 auto}
  .svc-url{display:block;text-align:left;font-size:10.5px;color:var(--tx3);padding:1px 0 3px;word-break:break-all}
  .svc-url:hover{color:var(--link,var(--brand-2));text-decoration:underline}
  .svc-acts{display:flex;gap:4px;flex-wrap:wrap}

  /* ───────── 嵌入 DSH 主区时的紧凑模式 ───────── */
  html[data-embed="1"] .topbar{padding:6px 10px;gap:8px}
  html[data-embed="1"] .toolbar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:5px;padding-bottom:2px}
  html[data-embed="1"] .toolbar .chip{height:22px;padding:0 7px;font-size:11px;flex:0 0 auto}
  html[data-embed="1"] .brand-sub{display:none}

  /* ───────── 空状态 ───────── */
  .empty-wrap{display:flex;align-items:flex-start;justify-content:center;padding:56px 24px}
  .empty-wrap[hidden],.matrix[hidden]{display:none}
  .empty-card{max-width:560px;width:100%;border:1px solid var(--b2);border-radius:10px;background:var(--l1);
    padding:22px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .empty-k{font-size:15px;font-weight:600;color:var(--tx1)}
  .empty-card p{margin:0;font-size:12px;line-height:1.75;color:var(--tx3)}
  .empty-card code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--tx2)}
  .empty-card .hint{font-size:11px;color:var(--tx4)}

  /* ───────── footer ───────── */
  .footer{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:7px 16px;border-top:1px solid var(--b2);
    background:var(--l1);font-size:11.5px;color:var(--tx4)}
  .footer .next{display:flex;align-items:center;gap:8px;color:var(--tx3)}
  .footer .next b{color:var(--tx2);font-weight:500}
  .pill{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:6px;corner-shape:var(--corner);
    border:1px solid var(--b2);color:var(--tx3);font-size:11px;background:var(--l2)}

  /* ───────── focus view ───────── */
  .focus-wrap{padding:14px 16px 20px;min-width:1420px}
  .focus-summary{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap}
  .sumbox{flex:1 1 220px;min-width:200px;border:1px solid var(--b1);border-radius:10px;corner-shape:var(--corner);background:var(--l2);padding:10px 12px}
  .sumbox .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx4)}
  .sumbox .v{margin-top:4px;font-size:12.5px;color:var(--tx1);line-height:1.45}
  .sumbox[data-tone="issue"]{border-color:color-mix(in srgb,var(--red) 34%,var(--b1))}
  .sumbox[data-tone="ok"]{border-color:color-mix(in srgb,var(--green) 34%,var(--b1))}
  .focus-lane{border:1px solid var(--b1);border-radius:11px;corner-shape:var(--corner);overflow:hidden;background:var(--l1)}
  .focus-lane .lane{border:0;background:transparent;box-shadow:none}
  .focus-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin-top:11px}
  .pane{border:1px solid var(--b1);border-radius:10px;corner-shape:var(--corner);background:var(--l2);overflow:hidden}
  .pane-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--b1);
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx4)}
  .pane-head .n{margin-left:auto;color:var(--tx3);text-transform:none;letter-spacing:0}
  .steplist{list-style:none;margin:0;padding:4px 12px 10px;display:flex;flex-direction:column}
  .steplist li{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--b1)}
  .steplist li:last-child{border-bottom:0}
  .steplist .idx{width:18px;height:18px;flex:0 0 auto;display:grid;place-items:center;border-radius:5px;font-size:10px;
    color:var(--brand-2);background:color-mix(in srgb,var(--brand) 14%,transparent);border:1px solid color-mix(in srgb,var(--brand) 26%,transparent)}
  .steplist b{font-size:12.5px;font-weight:500;display:block;line-height:1.45;color:var(--tx1)}
  .steplist p{margin:2px 0 0;font-size:11.5px;color:var(--tx4);line-height:1.5}
  .steplist code{font-size:11px;padding:1px 5px;border-radius:4px;background:var(--l3);border:1px solid var(--b1);color:var(--tx2)}
  .sesslist{padding:4px 6px 6px;display:flex;flex-direction:column;gap:1px}
  .sessrow{display:flex;align-items:center;gap:9px;padding:7px;border-radius:6px;corner-shape:var(--corner);text-align:left;
    transition:background-color 160ms var(--ease-out)}
  .sessrow:hover{background:var(--hover)}
  .sess-title{font-size:12.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess-at{margin-left:auto;font-size:10.5px;color:var(--tx4)}
  .pane-foot{padding:0 12px 10px;font-size:10.5px;color:var(--tx4)}
  .timeline{padding:4px 12px 10px;display:flex;flex-direction:column}
  .tl{display:grid;grid-template-columns:50px 12px 1fr 1.4fr;align-items:center;gap:8px;padding:6px 0;
    border-bottom:1px solid var(--b1);font-size:12px}
  .tl:last-child{border-bottom:0}
  .tl-time{color:var(--tx4);font-size:10.5px}
  .tl-dot{width:6px;height:6px;border-radius:50%;background:var(--tone)}
  .tl-act{color:var(--tx2)}
  .tl-note{color:var(--tx4);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ───────── density ───────── */
  html[data-density="compact"] .tnode{padding:5px 8px 6px 9px;border-radius:7px}
  html[data-density="compact"] .tnode-title{font-size:12px}
  html[data-density="compact"] .tnode-meta{font-size:10px}
  html[data-density="compact"] .canvas{padding:8px 0 10px}

  /* ───────── 节点详情卡 ───────── */
  .detail{position:fixed;inset:0;z-index:45;pointer-events:none}
  .detail[hidden]{display:none}
  .detail-card{position:fixed;width:336px;max-height:calc(100vh - 24px);overflow:auto;pointer-events:auto;
    border:1px solid var(--b3);border-radius:12px;corner-shape:var(--corner);background:var(--l2);
    box-shadow:0 24px 60px -28px rgba(0,0,0,.9);padding:12px 13px 11px;
    opacity:0;transform:scale(.96);transition:opacity 150ms var(--ease-out),transform 150ms var(--ease-out)}
  .detail[data-show="true"] .detail-card{opacity:1;transform:scale(1)}
  .detail-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .detail-head .kind{font-size:9.5px;letter-spacing:.07em;color:var(--tone);text-transform:uppercase}
  .detail-head .nid{font-size:9.5px;color:var(--tx4)}
  .detail-close{margin-left:auto;width:20px;height:20px;border-radius:5px;color:var(--tx4);font-size:11px;line-height:1}
  .detail-close:hover{background:var(--hover);color:var(--tx1)}
  .detail h3{margin:0 0 6px;font-size:14px;line-height:1.4;font-weight:500;color:var(--tx1)}
  .detail-path{display:flex;flex-wrap:wrap;align-items:center;gap:3px;font-size:10.5px;color:var(--tx4);margin-bottom:9px}
  .detail-path button{color:var(--tx3);font-size:10.5px;padding:1px 4px;border-radius:4px}
  .detail-path button:hover{background:var(--hover);color:var(--tx1)}
  .detail-sec{margin-top:9px;padding-top:9px;border-top:1px solid var(--b1)}
  .detail-k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx4);margin-bottom:5px}
  .detail-row{display:flex;gap:8px;font-size:11.5px;line-height:1.55;margin-bottom:4px}
  .detail-row dt{flex:0 0 40px;color:var(--tx4)}
  .detail-row dd{margin:0;color:var(--tx2);word-break:break-word}
  .detail-row dd.mono{font-variant-numeric:tabular-nums;color:var(--tx3);font-size:11px}
  .detail-title{cursor:text;border-radius:5px;padding:1px 3px;margin-left:-3px;transition:background-color 140ms var(--ease-out)}
  .detail-title:hover{background:var(--hover)}
  .editval{display:block;width:100%;text-align:left;font-size:11.5px;line-height:1.55;color:var(--tx2);
    padding:1px 4px;margin:-1px -4px;border-radius:5px;transition:background-color 140ms var(--ease-out)}
  .editval:hover{background:var(--hover);color:var(--tx1)}
  .editval.empty{color:var(--tx4);border:1px dashed var(--b2);text-align:center;font-size:11px}
  .dfield{width:100%;font:inherit;font-size:11.5px;color:var(--tx1);background:var(--l3);
    border:1px solid var(--b3);border-radius:6px;padding:5px 7px;resize:vertical;min-height:30px}
  .dfield:focus{outline:2px solid var(--brand);outline-offset:1px}
  .dedit{display:flex;align-items:center;gap:5px;margin-top:5px}
  .dedit-hint{font-size:9.5px;color:var(--tx4);margin-left:auto}
  .dselect{font:inherit;font-size:11.5px;color:var(--tx1);background:var(--l3);border:1px solid var(--b2);
    border-radius:6px;padding:2px 5px}
  .dselect:disabled{opacity:.55}
  .detail-chips{display:flex;flex-wrap:wrap;gap:5px}
  .dchip{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 8px;border-radius:6px;corner-shape:var(--corner);
    border:1px solid var(--b2);background:var(--l3);font-size:11px;color:var(--tx2);max-width:100%}
  .dchip:hover{border-color:var(--b3);color:var(--tx1)}
  .dchip i{width:5px;height:5px;border-radius:50%;background:var(--tone);flex:0 0 auto}
  .dchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .psrc{margin-left:6px;text-transform:none;letter-spacing:0;color:var(--tx3);font-size:9.5px;
    padding:1px 5px;border-radius:4px;background:var(--l3);border:1px solid var(--b1)}
  .prompt-list{display:flex;flex-direction:column;gap:1px}
  .prow{display:flex;align-items:center;gap:6px;border-radius:6px;transition:background-color 140ms var(--ease-out)}
  .prow:hover{background:var(--hover)}
  .ptitle{flex:1;text-align:left;font-size:11.5px;color:var(--tx2);padding:5px 6px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ptitle:hover{color:var(--tx1)}
  .pbtn{height:22px;padding:0 7px;border-radius:5px;corner-shape:var(--corner);border:1px solid var(--b2);
    background:var(--l3);color:var(--tx3);font-size:10.5px;flex:0 0 auto;
    transition:color 140ms var(--ease-out),border-color 140ms var(--ease-out),background-color 140ms var(--ease-out)}
  .pbtn:hover{color:var(--tx1);border-color:var(--b3)}
  .pbtn.run{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent);
    background:color-mix(in srgb,var(--green) 12%,transparent)}
  .pbtn.run:hover{color:var(--tx1);background:color-mix(in srgb,var(--green) 22%,transparent)}
  #launch-prompt{width:100%;font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--tx1);
    background:var(--l1);border:1px solid var(--b2);border-radius:7px;padding:8px 9px;resize:vertical;min-height:180px}
  #launch-prompt:focus{outline:2px solid var(--brand);outline-offset:1px}
  .pgen-wrap{margin:7px 0 0}
  .pgen-input{width:100%;max-height:200px;min-height:120px;resize:vertical;font:10.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--tx2);background:var(--l1);border:1px solid var(--b2);border-radius:7px;padding:8px 9px}
  .pgen-input:focus{outline:2px solid var(--brand);outline-offset:1px;color:var(--tx1)}
  .pgen-bar{display:flex;align-items:center;gap:6px;margin-top:4px}
  .pgen-hint{font-size:9.5px;color:var(--tx4);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .detail-acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
  .tnode.is-active{border-color:color-mix(in srgb,var(--brand) 60%,var(--b3));box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 26%,transparent)}

  /* ───────── modal ───────── */
  .modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--b3);
    backdrop-filter:blur(3px);opacity:0;transition:opacity 160ms var(--ease-out)}
  .modal[hidden]{display:none}
  .modal[data-show="true"]{opacity:1}
  .modal-card{width:min(420px,92vw);border:1px solid var(--b2);border-radius:12px;corner-shape:var(--corner);
    background:var(--l2);box-shadow:var(--shadow-pop);transform:scale(.96);opacity:0;
    transition:transform 180ms var(--ease-out),opacity 180ms var(--ease-out)}
  .modal[data-show="true"] .modal-card{transform:scale(1);opacity:1}
  .modal-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--b1);font-size:13px;font-weight:500}
  .modal-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modal-x{margin-left:auto;width:22px;height:22px;border-radius:6px;color:var(--tx4);font-size:12px}
  .modal-x:hover{background:var(--hover);color:var(--tx1)}
  .modal-body{padding:12px 14px;display:flex;flex-direction:column;gap:7px}
  .mrow{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--tx4)}
  .mrow b{color:var(--tx2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow.warn b{color:var(--amber)}
  .mnote{font-size:11.5px;color:var(--tx4);padding-top:4px;border-top:1px dashed var(--b1)}
  .modal-foot{display:flex;justify-content:flex-end;gap:7px;padding:10px 14px 13px}
  .tbtn.ghostmodal{background:transparent}

  /* ───────── toast ───────── */
  .toast{position:fixed;left:50%;bottom:52px;transform:translate(-50%,10px);z-index:40;display:flex;align-items:center;gap:9px;
    padding:8px 13px;border-radius:9px;corner-shape:var(--corner);border:1px solid var(--b2);background:var(--l3);
    box-shadow:var(--shadow-pop);font-size:12.5px;color:var(--tx1);opacity:0;pointer-events:none;
    transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
  .toast[data-show="true"]{opacity:1;transform:translate(-50%,0)}
  .toast .dot{background:var(--green)}

  @media (prefers-reduced-motion:reduce){ *{transition-duration:1ms !important;animation-duration:1ms !important} }
  @media (hover:none){ .tnode:hover{transform:none} }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none" stroke-width="1.6" stroke-linecap="round">
          <path d="M2.4 8a5.6 5.6 0 0 1 5.6-5.6c2 0 3.7 1 4.7 2.6"/>
          <path d="M13.6 8a5.6 5.6 0 0 1-5.6 5.6c-2 0-3.7-1-4.7-2.6"/>
          <path d="M12.7 2.6v2.6H10"/><path d="M3.3 13.4v-2.6H6"/>
        </svg>
      </span>
      <div>
        <h1>闭环轮转</h1>
        <p id="brand-sub">LOOP ROTATION · 树形收敛</p>
      </div>
    </div>
    <div class="grow"></div>
    <div class="seg" role="group" aria-label="视图切换">
      <button id="tab-matrix" aria-pressed="true">泳道矩阵</button>
      <button id="tab-focus" aria-pressed="false">项目聚焦</button>
    </div>
    <div class="meta-strip mono">
      <span class="kpi"><span class="dot" style="background:var(--tx4)"></span><span>数据 <b id="stamp">–</b></span></span>
      <span class="kpi"><span class="dot doing"></span><span>执行中 <b id="k-doing">0</b></span></span>
      <span class="kpi"><span class="dot blocked"></span><span>阻塞 <b id="k-blocked">0</b></span></span>
      <span class="kpi"><span class="dot done"></span><span>已收敛 <b id="k-done">0</b></span></span>
      <button class="iconbtn" id="btn-theme" aria-label="切换主题">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/></svg>
        主题
      </button>
      <button class="iconbtn" id="btn-refresh" aria-label="刷新数据">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2.6V6h-3.4"/></svg>
        刷新
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="chipbar" role="group" aria-label="筛选">
      <button class="chip" data-filter="all" aria-pressed="true">全部项目</button>
      <button class="chip" data-filter="blocked" aria-pressed="false">仅看阻塞</button>
      <button class="chip" data-filter="open" aria-pressed="false">未收敛</button>
      <span style="width:1px;height:16px;background:var(--b2);margin:0 4px"></span>
      <button class="chip" id="density" aria-pressed="true">紧凑</button>
      <span style="width:1px;height:16px;background:var(--b2);margin:0 4px"></span>
      <button class="chip" id="back-to-dsh" hidden title="返回到 DSH">← 返回</button>
      <button class="chip" id="add-project">+ 项目</button>
      <button class="chip" id="load-json">载入 JSON</button>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
      <button class="chip" id="export-json">导出 JSON</button>
      <span class="hint" id="save-state" style="margin-left:6px"></span>
      <span class="hint" id="data-src" style="margin-left:6px"></span>
    </div>
    <div class="grow"></div>
    <div id="focus-switch" class="chipbar" hidden></div>
    <span class="hint" id="toolbar-hint">闭环 → 目标 → 构思 → 执行；叶子完成后逐级「确认关闭」，全关闭则闭环收敛</span>
  </div>

  <main class="scroll" id="stage">
    <div class="empty-wrap" id="empty" hidden>
      <div class="empty-card">
        <div class="empty-k">还没有项目</div>
        <p>轮转面板按项目工作：每个项目在自己的目录下放一份 <code>.dsh/rotation.json</code>，
        面板通过注册表找到它们，读写都直接落在项目里。</p>
        <button class="tbtn primary-converge" id="empty-add">添加第一个项目</button>
        <div class="hint" style="margin-top:10px">也可以先点工具栏「+ 项目」，或把窗口缩到一半用「载入 JSON」看样例。</div>
      </div>
    </div>
    <div class="matrix" id="matrix"></div>
    <div class="focus-wrap" id="focus" hidden></div>
  </main>

  <footer class="footer">
    <span class="next">
      <span class="pill"><span class="dot blocked"></span>建议下一个轮转</span>
      <b id="next-project">–</b>
      <span id="next-reason">–</span>
    </span>
    <div class="grow"></div>
    <span>父子关系用连线表示 · 关闭自下而上传播 · 全部关闭后闭环收敛</span>
  </footer>
</div>
<div class="detail" id="detail" hidden>
  <div class="detail-card" role="dialog" aria-label="节点详情"></div>
</div>

<div class="modal" id="ask" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="ask-title" style="width:min(520px,94vw)">
    <div class="modal-head"><span id="ask-title">确认</span>
      <button class="modal-x" id="ask-x" aria-label="关闭">✕</button></div>
    <div class="modal-body" id="ask-body"></div>
    <div class="modal-foot">
      <button class="tbtn" id="ask-cancel">取消</button>
      <button class="tbtn primary-converge" id="ask-ok">确认</button>
    </div>
  </div>
</div>

<div class="modal" id="launch" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="launch-title" style="width:min(560px,94vw)">
    <div class="modal-head"><span id="launch-title">发起会话</span>
      <button class="modal-x" id="launch-x" aria-label="关闭">✕</button></div>
    <div class="modal-body" id="launch-body"></div>
    <div class="modal-foot">
      <button class="tbtn" id="launch-copy">复制 prompt</button>
      <button class="tbtn" id="launch-cancel">取消</button>
      <button class="tbtn primary-converge" id="launch-ok">发起会话</button>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <span id="modal-title">确认关闭？</span>
      <button class="modal-x" id="modal-x" aria-label="关闭弹窗">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="tbtn" id="modal-cancel">取消</button>
      <button class="tbtn primary" id="modal-ok">确认关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"><span class="dot"></span><span id="toast-text"></span></div>

<script src="cards.js"></script>
<script>
/* ─────────── 常量 ─────────── */
const STAGES = [
  { key:'loop', label:'闭环',              en:'Loop', color:'var(--brand)' },
  { key:'goal', label:'目标',              en:'Goal', color:'var(--blue-300)' },
  { key:'idea', label:'构思',              en:'Idea', color:'var(--amber)' },
  { key:'exec', label:'执行 · 验证 · 反馈', en:'Exec', color:'var(--green)' },
];
const KIND = { loop:'闭环', goal:'目标', idea:'构思', exec:'执行' };
const KIND_TONE = { loop:'var(--brand)', goal:'var(--blue-300)', idea:'var(--amber)', exec:'var(--green)' };
const STATUS = {
  doing:{ label:'执行中', tone:'var(--brand-2)' },
  ready:{ label:'就绪',   tone:'var(--tx3)' },
  review:{ label:'待验收', tone:'var(--amber)' },
  plan:{ label:'规划中',  tone:'var(--tx4)' },
  blocked:{ label:'阻塞',  tone:'var(--red)' },
  done:{ label:'待确认',  tone:'var(--amber)' },

    raw: n,
    title: n.title,
    status: n.status || 'plan',
    closed: !!n.closed_at,

      ? (n.verify ? `验证：${n.verify}` : '')
      : (n.approach || (n.acceptance ? `验收：${n.acceptance}` : '')),
    issues: (n.issues || []).filter(i => !i.resolved_at).map(i => i.text),
    children: (n.children || []).map(conv),
  });
  const root = conv(card.loop);
  if (card.loop.closed_at) root.convergedAt = new Date(card.loop.closed_at).toLocaleString('sv-SE').slice(0,16);
  return {
    id: 'card-' + root.id,
    name: (card.project && card.project.name) || '未命名闭环',
    tag: tail || '未绑定工作区',
    session: '', sessions: [], trail: [],
    file: file || '',
    card,
    root,
  };
}

async function resolveApiBase() {
  if (/^https?:/.test(location.protocol)) return API_BASE;
  const list = Array.isArray(window.__ROTATION_API_CANDIDATES__) ? window.__ROTATION_API_CANDIDATES__ : [];

/* ─────────── 树工具 ─────────── */
function walk(n, fn, depth=0){ fn(n, depth); (n.children||[]).forEach(c=>walk(c, fn, depth+1)); }
function findNode(root, id){ let hit=null; walk(root, n=>{ if(n.id===id) hit=n; }); return hit; }
function findParent(root, id){ let hit=null; walk(root, n=>{ (n.children||[]).forEach(c=>{ if(c.id===id) hit=n; }); }); return hit; }
function leaves(n){ return (n.children||[]).length ? (n.children||[]).flatMap(leaves) : [n]; }
function readyToClose(n){ return !n.closed && (n.children||[]).length>0 && n.children.every(c=>c.closed); }
function anyBlocked(n){ let h=false; walk(n, x=>{ if(x.status==='blocked' && !x.closed) h=true; }); return h; }
function anyDoing(n){ let h=false; walk(n, x=>{ if(x.status==='doing' && !x.closed) h=true; }); return h; }
function blockCount(n){ let c=0; walk(n, x=>{ if(x.status==='blocked' && !x.closed) c++; }); return c; }
function derivedStatus(n){
  const kids = n.children||[];
  if (!kids.length) return n.status || 'plan';
  if (kids.every(k=>k.closed)) return 'done';        // 直接子节点全关 → 待确认
  if (kids.some(k=>k.closed) || anyDoing(n)) return 'doing';
  return 'ready';
}
function stateOf(n){
  if (n.kind==='loop' && n.closed) return { key:'converged', label:'已收敛', tone:'var(--green)' };
  if (n.closed) return { key:'closed', label:'已关闭', tone:'var(--tx3)' };
  if (readyToClose(n)) return { key:'ready-close', label: n.kind==='loop'?'待收敛':'待确认', tone:'var(--amber)' };
  const d = derivedStatus(n);
  if (d==='blocked') return { key:'blocked', label:'阻塞', tone:'var(--red)' };
  const s = STATUS[d] || STATUS.plan;
  return { key:'work', label:s.label, tone:s.tone };
}
function nodeTone(n){
  const s = stateOf(n);
  if (s.key==='blocked') return 'var(--red)';
  if (s.key==='ready-close') return 'var(--amber)';
  if (s.key==='converged'||s.key==='closed') return 'var(--tx4)';
  return KIND_TONE[n.kind];
}
function progressOf(n){
  const kids = n.children||[];
  const closed = kids.filter(k=>k.closed).length;
  const lv = leaves(n);
  return { closed, kids: kids.length, doneLeaves: lv.filter(l=>l.closed).length, totalLeaves: lv.length };
}
function hasBlocked(p){ return anyBlocked(p.root); }

/* ─────────── 项目统计 ─────────── */
function projectStats(p){
  const all = [];
  walk(p.root, n => all.push(n));
  const kind = { loop:0, goal:0, idea:0, exec:0 };
  const stat = { doing:0, ready:0, plan:0, blocked:0, closed:0 };
  let issues = 0, noVerify = 0, noProof = 0, folded = 0;
  const closedAt = [];
  all.forEach(n => {
    kind[n.kind] = (kind[n.kind] || 0) + 1;
    if (n.closed) stat.closed++;
    else if (n.status === 'blocked') stat.blocked++;
    else if (n.status === 'doing') stat.doing++;
    else if (n.status === 'ready') stat.ready++;
    else stat.plan++;
    issues += (n.issues || []).length;
    if (n.kind === 'exec' && n.raw && !String(n.raw.verify || '').trim()) noVerify++;
    if (n.closed && n.kind === 'exec' && n.raw && !String(n.raw.proof || '').trim()) noProof++;
    if (n.raw && n.depth < 3 && (n.children || []).length) folded += 0;
    if (n.closed && n.raw && n.raw.closed_at) closedAt.push(Date.parse(n.raw.closed_at));
  });
  const goals = p.root.children || [];
  const goalClosed = goals.filter(g => g.closed).length;
  const execs = all.filter(n => n.kind === 'exec');
  const execDone = execs.filter(n => n.closed).length;

  closedAt.sort((a,b)=>a-b);
  const spanMs = closedAt.length > 1 ? closedAt[closedAt.length-1] - closedAt[0] : 0;
  const spanDays = spanMs / 86400000;
  const rate = spanDays > 0.05 ? closedAt.length / spanDays : null;
  const remain = Math.max(0, execs.length - execDone);
  const etaDays = rate ? remain / rate : null;
  const conf = closedAt.length >= 6 ? '高' : closedAt.length >= 3 ? '中' : '低';

  const doneRatio = execs.length ? execDone / execs.length : 0;
  const blockRatio = execs.length ? stat.blocked / execs.length : 0;
  const verifyRatio = execs.length ? 1 - noVerify / execs.length : 1;
  let score = Math.round((doneRatio * 62) + ((1 - blockRatio) * 23) + (verifyRatio * 15));
  if (!execs.length) score = 0;
  score = Math.max(0, Math.min(100, score));
  const health = (execDone === 0 && stat.blocked === 0)
    ? { label:'起步', tone:'var(--tx3)' }
    : score >= 75 ? { label:'健康', tone:'var(--green)' }
    : score >= 45 ? { label:'偏紧', tone:'var(--amber)' }
    : { label:'危险', tone:'var(--red)' };

  const blockedExec = execs.filter(n => n.status === 'blocked' && !n.closed).length;
  const nowMs = Date.now();
  const inflight = all
    .filter(n => n.kind === 'exec' && !n.closed && n.raw && n.raw.started_at)
    .map(n => ({ title: n.title, days: (nowMs - Date.parse(n.raw.started_at)) / 86400000 }))
    .sort((a, b) => b.days - a.days);
  const avgInflight = inflight.length ? inflight.reduce((a, x) => a + x.days, 0) / inflight.length : null;
  const overdue = inflight.filter(x => x.days > 7).length;
  return { all, kind, stat, issues, noVerify, noProof, goals, goalClosed, execs, execDone, closedNodes: closedAt.length, blockedExec,
           inflight, avgInflight, overdue,
           spanDays, rate, remain, etaDays, conf, score, health, lastClosed: closedAt.length ? closedAt[closedAt.length-1] : null };
}

function localKey(d){
  return d.toLocaleDateString('sv-SE');           // yyyy-mm-dd（本地时区）
}
function trendData(p, days = 14){
  const now = new Date();
  const buckets = [];
  for (let i = days - 1; i >= 0; i--){
    const d = new Date(now); d.setDate(now.getDate() - i); d.setHours(0,0,0,0);
    buckets.push({ d, key: localKey(d), closed: 0, execClosed: 0 });
  }
  const byKey = new Map(buckets.map(b => [b.key, b]));
  let closedInWindow = 0, execTotal = 0, execClosedTotal = 0;
  walk(p.root, (n) => {
    if (n.kind === 'exec') execTotal++;
    if (!n.closed || !n.raw || !n.raw.closed_at) return;
    if (n.kind === 'exec') execClosedTotal++;
    const k = localKey(new Date(n.raw.closed_at));
    const b = byKey.get(k);
    if (!b) return;
    b.closed++;
    closedInWindow++;
    if (n.kind === 'exec') b.execClosed++;
  });
  let cum = 0;
  buckets.forEach(b => { cum += b.execClosed; b.cum = cum; });
  return { buckets, closedInWindow, execTotal, execClosedTotal, peak: Math.max(0, ...buckets.map(b => b.closed)) };
}
function trendMarkup(p){
  const t = trendData(p, 14);
  const W = 244, H = 46, n = t.buckets.length, gap = 2;
  const bw = (W - gap * (n - 1)) / n;
  const maxBar = Math.max(1, t.peak);
  const goalY = H - (t.execTotal ? (t.execClosedTotal / Math.max(1, t.execTotal)) * (H - 6) + 3 : H);
  let bars = '', line = '';
  t.buckets.forEach((b, i) => {
    const h = b.closed ? Math.max(2, (b.closed / maxBar) * (H - 8)) : 1;
    const x = i * (bw + gap), y = H - h;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"
      fill="${b.closed ? 'var(--brand-2)' : 'var(--b2)'}" opacity="${b.closed ? .85 : .55}"/>`;
  });
  const step = (W - 1) / Math.max(1, n - 1);
  const pts = t.buckets.map((b, i) => {
    const y = H - (t.execTotal ? (b.cum / Math.max(1, t.execTotal)) * (H - 6) - 0 : 0);
    return `${(i * step).toFixed(1)},${(H - 1 - (t.execTotal ? (b.cum / t.execTotal) * (H - 6) : 0)).toFixed(1)}`;
  }).join(' ');
  if (t.execTotal) line = `<polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="1.3" stroke-linejoin="round" opacity=".9"/>`;
  const first = t.buckets[0].key.slice(5), last = t.buckets[n-1].key.slice(5);
  const peakDay = t.buckets.reduce((a, b) => b.closed > a.closed ? b : a, t.buckets[0]);
  if (!t.closedInWindow) {
    return `<div class="info-sec">
      <div class="info-k">收敛趋势（近 14 天）</div>
      <div class="info-empty">近 14 天没有节点关闭</div>
    </div>`;
  }
  return `<div class="info-sec">
    <div class="info-k">收敛趋势（近 14 天）</div>
    <svg class="trend" viewBox="0 0 ${W} ${H + 10}" preserveAspectRatio="none" role="img"
         aria-label="近 14 天每日关闭 ${t.closedInWindow} 项">
      ${bars}${line}
      <text x="0" y="${H + 9}" class="tlab">${first}</text>
      <text x="${W}" y="${H + 9}" class="tlab" text-anchor="end">${last}</text>
    </svg>
    <div class="info-row" style="margin-top:2px">关闭<b>${t.closedInWindow} 项</b></div>
    <div class="info-row">峰值日<b>${peakDay.closed} 项 · ${peakDay.key.slice(5)}</b></div>
    <div class="info-row">执行收敛<b>${t.execClosedTotal}/${t.execTotal || 0}</b></div>
  </div>`;
}

/* ─────────── 节点 ─────────── */
function foldedMarkup(n){
  if (n.depth !== 3) return '';
  const kids = n.children || [];
  if (!kids.length) return '';
  return `<div class="folded">${kids.map(k=>{
    const ks = stateOf(k), closable = !k.closed;
    return `<div class="frow">
      <span class="fdot" style="--tone:${ks.tone}"></span>
      <span class="ftitle" title="${k.title}">${k.title}</span>
      ${k.closed ? `<span class="fst">已关闭</span>` : (closable ? `<button class="fbtn" data-close="${k.id}">完成</button>` : '')}
    </div>`;
  }).join('')}</div>`;
}

function lateBadge(n){
  if (n.closed || !n.raw || !n.raw.started_at) return '';
  const days = (Date.now() - Date.parse(n.raw.started_at)) / 86400000;
  if (days <= 7) return '';
  return `<div class="tnode-meta"><span class="late" title="开始于 ${n.raw.started_at}">⏳ 在途 ${days.toFixed(0)} 天</span></div>`;
}

function runBadge(p, n){
  const r = runFor(p, n);
  if (!r) return '';
  const tone = RUN_TONE[r.status] || 'var(--tx3)';
  const secs = Math.round((r.elapsedMs || 0) / 1000);
  const el = r.status === 'running' || r.status === 'starting'
    ? (secs >= 60 ? `${Math.floor(secs/60)}m${secs%60}s` : `${secs}s`) : '';
  return `<div class="tnode-meta"><span class="runbad" style="--tone:${tone}">
    <i class="rdot"></i>${RUN_LABEL[r.status] || r.status}${el ? ' · ' + el : ''}</span></div>`;
}

function nodeMarkup(n, p){
  const st = stateOf(n), tone = nodeTone(n), pr = progressOf(n);
  const hasKids = (n.children||[]).length>0;
  const canClose = !n.closed && (!hasKids || readyToClose(n));
  const closeLabel = n.kind==='loop' ? '确认收敛' : (hasKids ? '确认关闭' : '完成');
  const addKind = n.kind==='loop' ? 'goal' : n.kind==='goal' ? 'idea' : n.kind==='idea' ? 'exec' : null;
  const bars = hasKids ? `<span class="bars">${n.children.map(k=>`<i class="${k.closed?'on':''}"></i>`).join('')}</span>` : '';
  const issues = (n.issues||[]).map(i=>`<div class="issue">⚠ ${i}</div>`).join('');
  const foot = [
    hasKids ? `<span class="mono" style="font-size:10.5px;color:var(--tx4)">${pr.closed}/${pr.kids} 关闭</span>` : '',
    canClose ? `<button class="tbtn ${n.kind==='loop'?'primary-converge':'primary'}" data-close="${n.id}">${closeLabel}</button>` : '',
    n.closed ? `<button class="tbtn" data-reopen="${n.id}">重开</button>` : '',
    addKind ? `<button class="tbtn ghost" data-add="${n.id}">+ ${KIND[addKind]}</button>` : '',
  ].filter(Boolean).join('');
  return `<div class="tnode" data-nid="${n.id}" data-state="${st.key}" data-kind="${n.kind}" style="--tone:${tone};--st-tone:${st.tone}">
    <div class="tnode-top">
      <span class="kind">${KIND[n.kind]}</span>
      <span class="nid mono">${n.id}</span>
      <span class="st">${st.label}</span>
    </div>
    <div class="tnode-title" title="${n.title}">${n.title}</div>
    ${n.meta ? `<div class="tnode-meta mono">${n.meta}</div>` : ''}
    ${(blockCount(n) && n.kind!=='exec') ? `<div class="tnode-meta"><span class="blk">⚠ ${blockCount(n)} 项阻塞</span></div>` : ''}
    ${lateBadge(n)}
    ${p ? runBadge(p, n) : ''}
    ${n.hiddenClosed ? `<button class="foldchip" data-fold="${n.id}" title="把 ${n.hiddenClosed} 个已关闭节点收在这里">▸ 已关闭 ${n.hiddenClosed}</button>` : ''}
    ${n.closedShown ? `<button class="foldchip on" data-fold="${n.id}" title="收起 ${n.closedShown} 个已关闭节点">▾ 收起已关闭 ${n.closedShown}</button>` : ''}
    ${issues}
    ${foldedMarkup(n)}
    ${(bars||foot) ? `<div class="tfootline">${bars}<span class="grow"></span>${foot}</div>` : ''}
  </div>`;
}

/* ─────────── 布局与连线 ─────────── */
const foldedClosed = new Set();   // 展开「已关闭子节点」的父节点 id
function visibleRoot(root){
  const clone = (n) => {
    const kids = [];
    let hidden = 0, shown = 0;
    for (const k of (n.children || [])){
      if (k.closed && !foldedClosed.has(n.id)){ hidden++; continue; }
      if (k.closed) shown++;
      kids.push(clone(k));
    }
    return Object.assign({}, n, { children: kids, hiddenClosed: hidden, closedShown: shown });
  };
  return clone(root);
}
function ensureVisible(nid){
  const p = findProjectByNode(nid);
  if (!p) return false;
  let found = false;
  (function walk(n, ancestors){
    for (const k of (n.children || [])){
      if (k.id === nid){
        ancestors.forEach(a => foldedClosed.add(a));
        found = true; return true;
      }
      if (walk(k, ancestors.concat([n.id]))) return true;
    }
    return false;
  })(p.root, []);
  return found;
}

function treeLayout(root){
  const nodes=[]; let row=0;
  (function rec(n, depth){
    n.depth = depth;
    const kids = n.children || [];
    // 死守 4 列：第 4 列再往下不再开新列，子节点折叠进卡片
    if (!kids.length || depth >= 3){ n.row = row++; }
    else { kids.forEach(k=>rec(k, depth+1)); n.row = (kids[0].row + kids[kids.length-1].row) / 2; }
    nodes.push(n);
  })(root, 0);
  return { nodes, rows: Math.max(row,1) };
}

function mountCanvas(project, canvas){
  canvas.classList.remove('canvas--collapsed');
  canvas.style.height = '';
  const { nodes } = treeLayout(visibleRoot(project.root));
  canvas.__nodes = nodes;
  canvas.innerHTML = `<svg class="edges" aria-hidden="true"></svg>` + nodes.map(n => nodeMarkup(n, project)).join('');
}

function layoutCanvas(project, canvas, cols){
  const nodes = canvas.__nodes || treeLayout(visibleRoot(project.root)).nodes;
  let maxH = 56;
  for (const n of nodes){
    const el = canvas.querySelector(`[data-nid="${n.id}"]`);
    if (!el) continue;
    const col = cols[Math.min(n.depth, cols.length-1)];
    el.style.width = col.w + 'px';
    n.h = el.offsetHeight || 56;
    maxH = Math.max(maxH, n.h);
  }
  const pitch = maxH + 12;
  const rows = Math.max(...nodes.map(n=>Math.ceil(n.row)+1), 1);
  for (const n of nodes){
    const el = canvas.querySelector(`[data-nid="${n.id}"]`);
    if (!el) continue;
    const col = cols[Math.min(n.depth, cols.length-1)];
    n.x = col.x;
    n.y = n.row * pitch + (pitch - n.h) / 2 + 8;
    el.style.left = n.x + 'px';
    el.style.top  = n.y + 'px';
  }
  canvas.style.height = (rows * pitch + 18) + 'px';

  const svg = canvas.querySelector('.edges');
  if (!svg) return;
  svg.setAttribute('viewBox', `0 0 ${canvas.clientWidth} ${canvas.clientHeight}`);
  let out = '';
  const anchors = [];
  const SW = { loop:2.2, goal:1.7, idea:1.4, exec:1.2 };

  const rootNode = nodes.find(n=>n.depth===0);
  if (rootNode){
    const ry = rootNode.y + rootNode.h/2;
    out += `<path class="trunk" d="M 6 ${ry} H ${rootNode.x - 8}" style="--edge:var(--b3);--ew:1"/>`;
  }

  for (const n of nodes){
    const kids = n.children||[];
    if (!kids.length || n.depth >= 3) continue;
    const px = n.x + cols[Math.min(n.depth, cols.length-1)].w;
    const py = n.y + n.h/2;
    const tone = KIND_TONE[n.kind];
    const sw = SW[n.kind] || 1.3;
    anchors.push([px, py, tone]);

    for (const k of kids){
      const cx = k.x, cy = k.y + k.h/2;
      const dx = Math.max(28, (cx - px) * .55);
      const stroke = k.closed ? 'var(--green)' : (k.status==='blocked' ? 'var(--red)' : tone);
      const cls = k.closed ? 'done' : (k.status==='blocked' ? 'blocked' : '');
      out += `<path class="${cls}" d="M ${px} ${py} C ${px+dx} ${py}, ${cx-dx} ${cy}, ${cx} ${cy}" style="--edge:${stroke};--ew:${sw}"/>`;
    }
  }
  out += anchors.map(([x,y,tone]) => `<circle class="j" cx="${x}" cy="${y}" r="2.6" fill="${tone}"/>`).join('');
  svg.innerHTML = out;
}

function renderCanvas(project, canvas, cols){
  mountCanvas(project, canvas);
  layoutCanvas(project, canvas, cols);
}

function renderCollapsed(p, canvas){
  canvas.classList.add('canvas--collapsed');
  canvas.style.height = '';

  canvas.innerHTML = (p.root.children||[]).map(g=>{
    const st = stateOf(g);
    return `<button class="gchip" data-act="focus" data-id="${p.id}" data-closed="${g.closed}" style="--tone:${st.tone}">
      <i></i><span>${g.title}</span><small class="mono">${(g.children||[]).length}</small></button>`;
  }).join('') + `<span class="gchip add" data-act="toggle" data-id="${p.id}">+ 展开树</span>
    <span style="margin-left:auto;font-size:10.5px;color:var(--tx4);font-variant-numeric:tabular-nums">${pr.doneLeaves}/${pr.totalLeaves} 执行项完成</span>`;
}

function matrixCols(){
  const matrix = $('#matrix');

  if (!canvas) return null;
  const cr = canvas.getBoundingClientRect();
  return STAGES.map((_, i) => {

    return { x: r.left - cr.left + 12, w: r.width - 24 };
  });
}
function focusCols(canvas){
  const w = canvas.clientWidth - 24, gap = 14;
  const cw = (w - gap*3) / 4;
  return STAGES.map((_, i) => ({ x: 12 + i*(cw+gap), w: cw }));
}

/* ─────────── 泳道 ─────────── */
function laneMarkup(p){

function visibleProjects(){

function renderMatrix(){
  const m = $('#matrix');
  const active = visibleProjects().filter(p=>!p.root.closed);
  const archived = PROJECTS.filter(p=>p.root.closed && (state.filter==='all' || state.filter==='open' ? true : false));
  const showArchive = state.filter!=='open';
  m.innerHTML = `<div class="stage-head corner">项目 / 阶段</div>` +
    STAGES.map((st,i)=>`<div class="stage-head" data-depth="${i}" style="--c:${st.color}">
      <span class="swatch"></span><span class="label">${st.label}</span><span class="en">${st.en}</span></div>`).join('') +
    `<div class="stage-head" data-depth="info"><span class="swatch" style="--c:var(--tx4)"></span><span class="label">信息 · 操作</span><span class="en">Info</span></div>` +
    active.map(laneMarkup).join('') +
    (showArchive ? archiveMarkup(archived) : '');

  const lanes = [...m.querySelectorAll('.lane')];
  lanes.forEach(lane => {
    const p = PROJECTS.find(x=>x.id===lane.dataset.project);
    const canvas = lane.querySelector('.canvas');
    if (!p || !canvas) return;
    if (collapsed.has(p.id)) renderCollapsed(p, canvas); else mountCanvas(p, canvas);
  });
  requestAnimationFrame(() => {
    const cols = matrixCols();
    if (!cols) return;
    lanes.forEach(lane => {
      const p = PROJECTS.find(x=>x.id===lane.dataset.project);
      const canvas = lane.querySelector('.canvas');
      if (!p || !canvas || collapsed.has(p.id)) return;
      layoutCanvas(p, canvas, cols);
    });
  });
}

function focusSwitch(){
  const box = $('#focus-switch');
  if (state.view!=='focus'){ box.hidden = true; box.innerHTML=''; return; }

  box.innerHTML = PROJECTS.map(p=>`<button class="chip" data-focus="${p.id}" aria-pressed="${p.id===state.focusId}">${p.name}</button>`).join('');
}

function nextAction(p){
  const out=[];
  walk(p.root, (n)=>{
    if (n.kind==='exec' && n.status==='blocked' && !n.closed)
      out.push({ text:`解阻断：${n.title}`, hint:(n.issues||[])[0] || '阻塞未处置，后续无法采集证据' });
  });
  walk(p.root, (n)=>{ if (readyToClose(n) && n.kind!=='loop') out.push({ text:`确认关闭：${n.title}`, hint:'子项已全部关闭，关闭后向上一级收敛' }); });
  if (readyToClose(p.root)) out.push({ text:`收敛闭环：${p.root.title}`, hint:'所有目标已关闭，可标记闭环完成' });
  if (!out.length){
    const doing = [], plan = [];
    walk(p.root, (n)=>{
      if (n.kind !== 'exec' || n.closed) return;
      if (n.status === 'doing') doing.push(n);
      else if (n.status === 'plan') plan.push(n);
    });
    const pick = doing[0] || plan[0];
    if (pick) out.push({
      text: `继续执行：${pick.title}`,
      hint: doing[0] ? '正在做，把验证与证据补齐后确认关闭' : '从计划队列里领下一项',
    });
  }
  return out.slice(0,3);
}

    : '聚焦单项目：从执行项开始，一层层确认关闭，直到闭环收敛';

function updateKpis(){
  let doing=0, blocked=0, converged=0;
  PROJECTS.forEach(p=>{
    if (p.root.closed) converged++;
    walk(p.root, n=>{ if(n.closed) return; if(n.status==='blocked') blocked++; if(n.status==='doing') doing++; });
  });
  $('#k-doing').textContent = doing;
  $('#k-blocked').textContent = blocked;
  $('#k-done').textContent = converged;
  const next = PROJECTS.find(hasBlocked) || PROJECTS.find(p=>!p.root.closed) || PROJECTS[0];
  $('#next-project').textContent = next ? next.name : '—';
  $('#next-reason').textContent = !next ? '还没有项目，先添加一个' : (hasBlocked(next) ? '有阻断未处置，先看它' : (next.root.closed ? '已收敛' : '闭环仍在推进'));
}

/* ─────────── 关闭 / 重开 / 加节点 ─────────── */
function findProjectByNode(id){
  for (const p of PROJECTS){ if (findNode(p.root, id)) return p; }
  return null;
}
let pendingClose = null;
function closeNode(id){ openConfirm(id); }
function doClose(id){
  const p = findProjectByNode(id); if (!p) return;
  const n = findNode(p.root, id);
  const parent = findParent(p.root, id);
  n.closed = true;
  if (n.raw){
    n.raw.closed_at = new Date().toISOString();
    if (n.raw.kind === 'exec'){
      if (!n.raw.proof) n.raw.proof = '（面板关闭，未附证据）';
      n.raw.status = 'done';
    }
  }
  if (n.kind==='loop'){ n.convergedAt = state.stamp; collapsed.delete(p.id); toast(`闭环「${n.title}」已收敛，已移入「已收敛」区`); }
  else if (parent && readyToClose(parent)) toast(`${KIND[n.kind]}「${n.title}」关闭 → ${KIND[parent.kind]}「${parent.title}」可确认关闭`);
  else toast(`${KIND[n.kind]}「${n.title}」已关闭`);
  render();
  persist(p);
}
function reopenNode(id){
  const p = findProjectByNode(id); if (!p) return;
  const n = findNode(p.root, id);
  if (n) { n.closed = false; if (n.raw) n.raw.closed_at = null; if (n.kind==='loop') delete n.convergedAt; }
  let changed = true;
  while (changed){
    changed = false;
    walk(p.root, (x)=>{ if (x.closed && (x.children||[]).some(c=>!c.closed)){ x.closed = false; if (x.raw) x.raw.closed_at = null; changed = true; } });
  }
  toast('已重开，上级回到未关闭状态');
  render();
  persist(p);
}
let seq = 0;
function addChild(id){
  const p = findProjectByNode(id); if (!p) return;
  const n = findNode(p.root, id);
  const kind = n.kind==='loop' ? 'goal' : n.kind==='goal' ? 'idea' : 'exec';
  const title = kind==='goal' ? '新目标（待命名）' : kind==='idea' ? '新构思（待命名）' : '新执行项（待命名）';
  n.children = n.children || [];
  const rawChild = { id:`${n.id}-n${++seq}`, kind, title, status:'plan', closed_at:null, issues:[] };
  if (kind === 'goal') rawChild.acceptance = '（待补）验收方式';
  if (kind === 'exec') rawChild.verify = '（待补）验证命令';
  n.children.push({ id: rawChild.id, kind, title, status:'plan', closed:false, raw: rawChild, children:[] });
  n.raw.children = n.raw.children || [];
  n.raw.children.push(rawChild);
  if (n.closed) n.closed = false;
  toast(`已为「${n.title}」新增${KIND[kind]}`);
  render();
  persist(p);
}

const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const EDIT_FIELDS = { loop:['intent','acceptance'], goal:['acceptance'], idea:['approach'], exec:['verify','proof'] };
const FIELD_LABEL = { intent:'意图', acceptance:'验收', approach:'方案', verify:'验证', proof:'证据' };
const STATUS_OPTS = ['plan','ready','doing','blocked','done'];

/* ─────────── Prompt 模板 ─────────── */
const PROMPT_TASKS = {
  loop: [
    { id:'split',   title:'拆成目标',        ask:'把上面这个闭环拆成 3–5 个目标，每个目标都要能单独验证；并为每个目标给出验收方式（优先写成可直接执行的命令）。' },
    { id:'closed',  title:'检查是否真闭合',  ask:'检查这个闭环是否真的闭合：每个目标是否都服务于同一个闭环意图、有没有目标其实不属于它、以及缺了哪一环。' },
  ],
  goal: [
    { id:'ideas',   title:'拆出构思',        ask:'针对这个目标给出 2–3 条可选实现路径（构思），每条写清方案要点、风险，以及对目标验收方式的影响。' },
    { id:'verify',  title:'验收可判定性',    ask:'检查这个目标的验收方式是否可判定；如果不可判定，改写为可执行的检查步骤或命令。' },
  ],
  idea: [
    { id:'regen',   title:'重新生成构思',    ask:'保留目标与约束，重新生成这个构思：给出 1–2 个替代方案，说明与当前方案的差异、代价与适用条件。' },
    { id:'plan',    title:'梳理执行计划',    ask:'把这个构思拆成执行计划：3–6 个可执行动作，每个动作给出验证方式与预期证据，并标注依赖顺序。' },
    { id:'risk',    title:'预演失败点',      ask:'预演这个构思落地会遇到什么：列出 3 个最可能的失败点与各自的早期信号。' },
  ],
  exec: [
    { id:'steps',   title:'给出执行步骤',    ask:'把这条执行项拆成具体可执行的操作步骤，每一步给出验证命令与通过标准。' },
    { id:'proof',   title:'补齐证据',        ask:'这条执行项准备关闭但证据不足。请列出应该采集哪些证据（命令、输出、截图）以及采集方式。' },
    { id:'blocker', title:'定位阻塞',        ask:'这条执行项当前阻塞。给出 3 个可能原因与各自的验证方法，按最可能优先排序。' },
  ],
};
const PROMPT_OUTPUT = '输出用 Markdown，小节标题固定；不要复述上下文，直接给结论与步骤。';

function taskListFor(p, n){
  const cardPrompts = p.card && p.card.prompts;
  const nodePrompts = n.raw && n.raw.prompts;
  if (Array.isArray(nodePrompts) && nodePrompts.length) return { list: nodePrompts, from: '节点自定义' };
  if (cardPrompts && Array.isArray(cardPrompts[n.kind]) && cardPrompts[n.kind].length) {
    return { list: cardPrompts[n.kind], from: 'rotation.json' };
  }
  return { list: PROMPT_TASKS[n.kind] || [], from: '内置' };
}

/* 上下文段可配：prompt_context.fields 有序列表；siblings 控制兄弟节点条数 */
const CTX_DEFAULT = {
  fields: ['project','loop','loop.intent','loop.acceptance','goal','goal.acceptance',
           'idea','idea.approach','node','node.acceptance','node.approach',
           'exec.verify','exec.proof','exec.issues','children'],
  siblings: 0,
  refs: [],
};
const CTX_DEF = {
  'project':         { sec:'ctx',  r:(p)=> `- 项目：${p.name}` },
  'loop':            { sec:'ctx',  r:(p,t)=> t[0] ? `- 当前待闭环：${t[0].title}` : null },
  'loop.intent':     { sec:'ctx',  r:(p,t)=> t[0] && t[0].raw && t[0].raw.intent ? `  - 闭环意图：${t[0].raw.intent}` : null },
  'loop.acceptance': { sec:'ctx',  r:(p,t)=> t[0] && t[0].raw && t[0].raw.acceptance ? `  - 闭环验收：${t[0].raw.acceptance}` : null },
  'goal':            { sec:'ctx',  r:(p,t,n)=>{ const g=t.find(x=>x.kind==='goal'); return g && g!==n ? `- 当前目标：${g.title}` : null; } },
  'goal.acceptance': { sec:'ctx',  r:(p,t,n)=>{ const g=t.find(x=>x.kind==='goal'); return g && g!==n && g.raw && g.raw.acceptance ? `  - 目标验收：${g.raw.acceptance}` : null; } },
  'idea':            { sec:'ctx',  r:(p,t,n)=>{ const i=t.find(x=>x.kind==='idea'); return i && i!==n ? `- 当前构思：${i.title}` : null; } },
  'idea.approach':   { sec:'ctx',  r:(p,t,n)=>{ const i=t.find(x=>x.kind==='idea'); return i && i!==n && i.raw && i.raw.approach ? `  - 方案：${i.raw.approach}` : null; } },
  'siblings':        { sec:'ctx',  r:(p,t,n,cfg)=>{
      const parent = t[t.length-2];
      if (!parent) return null;
      const sibs = (parent.children||[]).filter(x=>x.id!==n.id).slice(0, cfg.siblings || 3);
      if (!sibs.length) return null;
      return `- 同级${KIND[sibs[0].kind]}：${sibs.map(x=>`${x.title}${x.closed?'（已关闭）':''}`).join('；')}`;
    } },
  'refs':            { sec:'ctx',  r:(p,t,n,cfg)=>{
      const list = cfg.refs || [];
      if (!list.length) return null;
      const lines = list.map(id => {
        const x = findNode(p.root, id);
        if (!x) return null;
        const r = x.raw || {};
        const bits = [`状态 ${stateOf(x).label}`];
        if (x.kind === 'exec') {
          if (r.verify) bits.push(`验证 ${r.verify}`);
          if (r.proof) bits.push(`证据 ${r.proof}`);
          const open = (r.issues||[]).filter(i=>!i.resolved_at).map(i=>i.text);
          if (open.length) bits.push(`未处置反馈 ${open.join('；')}`);
        } else if (x.kind === 'idea' && r.approach) bits.push(`方案 ${r.approach}`);
        else if (r.acceptance) bits.push(`验收 ${r.acceptance}`);
        return `- 引用·${KIND[x.kind]}「${x.title}」(${x.id})：${bits.join('；')}`;
      }).filter(Boolean);
      return lines.length ? lines.join('\n') : null;
    } },
  'node':            { sec:'node', r:(p,t,n)=> `- 类型：${KIND[n.kind]}（id: ${n.id}）\n- 标题：${n.title}\n- 状态：${stateOf(n).label}` },
  'node.acceptance': { sec:'node', r:(p,t,n)=> (n.kind==='loop'||n.kind==='goal') && n.raw && n.raw.acceptance ? `- 验收：${n.raw.acceptance}` : null },
  'node.approach':   { sec:'node', r:(p,t,n)=> n.kind==='idea' && n.raw && n.raw.approach ? `- 方案：${n.raw.approach}` : null },
  'exec.verify':     { sec:'node', r:(p,t,n)=> n.kind==='exec' && n.raw && n.raw.verify ? `- 验证方式：${n.raw.verify}` : null },
  'exec.proof':      { sec:'node', r:(p,t,n)=> n.kind==='exec' ? `- 证据：${(n.raw && n.raw.proof) || '（未填写）'}` : null },
  'exec.issues':     { sec:'node', r:(p,t,n)=>{
      const open = ((n.raw && n.raw.issues) || []).filter(i=>!i.resolved_at).map(i=>i.text);
      return open.length ? `- 未处置反馈：${open.join('；')}` : null;
    } },
  'children':        { sec:'node', r:(p,t,n)=>{
      const kids = (n.children||[]).map(k=>`${KIND[k.kind]}·${k.title}`).slice(0, 8);
      return kids.length ? `- 已有子节点：${kids.join('；')}` : null;
    } },
};
function contextConf(p, n){
  const fromNode = n.raw && n.raw.prompt_context;
  const fromCard = p.card && p.card.prompt_context;
  const cfg = fromNode || fromCard || {};
  const refs = Array.isArray(cfg.refs) ? cfg.refs.filter(x => typeof x === 'string') : CTX_DEFAULT.refs;
  let fields = Array.isArray(cfg.fields) && cfg.fields.length ? cfg.fields.slice() : CTX_DEFAULT.fields.slice();
  if (refs.length && !fields.includes('refs')) fields = fields.concat(['refs']);   // refs 写了但 fields 没列 → 自动补在末尾
  return {
    fields,
    siblings: Number.isFinite(cfg.siblings) ? cfg.siblings : CTX_DEFAULT.siblings,
    refs,
  };
}

function composePrompt(p, n, task){
  const trail = pathTo(p.root, n.id);
  const cfg = contextConf(p, n);
  const ctx = [], node = [];
  for (const key of cfg.fields){
    const f = CTX_DEF[key];
    if (!f) continue;
    let v = null;
    try { v = f.r(p, trail, n, cfg); } catch { v = null; }
    if (!v) continue;
    (f.sec === 'ctx' ? ctx : node).push(v);
  }
  const out = [];
  if (ctx.length){ out.push('# 上下文', ...ctx, ''); }
  if (node.length){ out.push('# 当前节点', ...node, ''); }
  out.push('# 任务', task.ask, '');
  out.push('# 输出要求', PROMPT_OUTPUT);
  return out.join('\n');
}

async function copyText(txt){
  // 剪贴板 API 在没有用户激活/权限被拒时可能既不 resolve 也不 reject —— 加 600ms 竞速兜底
  if (navigator.clipboard && navigator.clipboard.writeText){
    const res = await Promise.race([
      navigator.clipboard.writeText(txt).then(() => 'ok').catch(() => 'fail'),
      new Promise(r => setTimeout(() => r('timeout'), 600)),
    ]);
    if (res === 'ok') return true;
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch { return false; }
}

const fmtTs = (iso) => new Date(iso).toLocaleString('sv-SE').slice(5, 16);
function pathTo(root, id){
  const arr = [];
  (function walkPath(n, trail){
    const next = trail.concat([n]);
    if (n.id === id){ arr.push(...next); return true; }
    return (n.children || []).some(c => walkPath(c, next));
  })(root, []);
  return arr;
}
function sessionMarkup(p, n){
  const r = runFor(p, n);
  const st = r ? (RUN_LABEL[r.status] || r.status) : '无会话';
  const tone = r ? (RUN_TONE[r.status] || 'var(--tx3)') : 'var(--tx4)';
  const secs = r ? Math.round((r.elapsedMs || 0) / 1000) : 0;
  const busy = r && (r.status === 'running' || r.status === 'starting');
  const tail = r && r.tail && r.tail.length ? r.tail[r.tail.length - 1] : null;
  const btn = busy
    ? `<button class="tbtn" data-run-cancel="1">取消</button>`
    : (r ? `<button class="tbtn" data-run-again="1">再跑一轮</button>` : '');
  return `<div class="detail-sec">
    <div class="detail-k">会话<span class="psrc" style="color:${tone}">${st}${busy ? ' · ' + (secs >= 60 ? Math.floor(secs/60) + 'm' : secs + 's') : ''}</span></div>
    ${r ? `<div class="detail-row"><dt>会话</dt><dd class="mono">${r.sessionId || '—'}</dd></div>
      <div class="detail-row"><dt>目录</dt><dd class="mono">${r.cwd || '—'}</dd></div>

      : `<div class="detail-row"><dt>说明</dt><dd>还没有跑过会话；在下面每条 prompt 后面点「发起」即可</dd></div>`}
    <div class="detail-acts" style="margin-top:8px">${btn}
      ${r && r.result && n.kind === 'exec' ? `<button class="tbtn" data-run-write="1">写进证据</button>` : ''}
    </div>
  </div>`;
}

function detailMarkup(p, n){
  const r = n.raw || {};

  const kids = n.children || [];
  const editable = (EDIT_FIELDS[n.kind] || []).map(f =>

  const timeRows = [];
  if (r.started_at) timeRows.push(['开始', fmtTs(r.started_at), true]);
  if (r.closed_at)  timeRows.push(['关闭', fmtTs(r.closed_at), true]);
  const inFlight = (!r.closed_at && r.started_at)
    ? ((Date.now() - Date.parse(r.started_at)) / 86400000) : null;
  if (inFlight != null) timeRows.push(['在途', fmtDays(inFlight), true]);
  const rows = timeRows.map(([k, v]) => `<div class="detail-row"><dt>${k}</dt><dd class="mono">${v}</dd></div>`).join('');

  const trail = pathTo(p.root, n.id);
  const pathHtml = [`<button data-jump="${p.root.id}" data-proj="${p.id}">${p.name}</button>`]
    .concat(trail.slice(1).map(x => `<span>›</span><button data-jump="${x.id}" data-proj="${p.id}">${x.title}</button>`)).join('');

  const issues = (r.issues || []).map(i => `<div class="issue">⚠ ${i.text}${i.resolved_at ? ' · 已处置' : ''}</div>`).join('');

  const kidsHtml = kids.length

            <i></i><span>${k.title}</span></button>`;

    : '';
  const canClose = !n.closed && (!kids.length || readyToClose(n));
  const acts = [
    canClose ? `<button class="tbtn primary" data-close="${n.id}">${n.kind === 'loop' ? '确认收敛' : (kids.length ? '确认关闭' : '完成')}</button>` : '',
    n.closed ? `<button class="tbtn" data-reopen="${n.id}">重开</button>` : '',
    `<button class="tbtn" data-copy="${n.id}">复制 JSON</button>`,
    `<button class="tbtn" data-gofocus="${p.id}">聚焦项目</button>`,
  ].filter(Boolean).join('');

  return `<div class="detail-head">
      <span class="kind" style="--tone:${tone}">${KIND[n.kind]}</span>
      <span class="nid mono">${n.id}</span>
      <span class="st" style="--st-tone:${st.tone}">${st.label}</span>
      <button class="detail-close" id="detail-x" aria-label="关闭详情">✕</button>
    </div>
    <h3 class="detail-title" data-nid="${n.id}" data-proj="${p.id}" title="点击编辑标题">${esc(n.title)}</h3>
    <div class="detail-path">${pathHtml}</div>
    <dl class="detail-sec" style="margin-top:0;padding-top:0;border-top:0">
      <div class="detail-row editable" data-field="status" data-nid="${n.id}" data-proj="${p.id}">
        <dt>状态</dt>
        <dd><select class="dselect" data-status="${n.id}" ${n.closed ? 'disabled' : ''}>
          ${STATUS_OPTS.map(x => `<option value="${x}" ${x === (r.status || 'plan') ? 'selected' : ''}>${(STATUS[x]||STATUS.plan).label}${x==='done'?'（待确认）':''}</option>`).join('')}
        </select></dd>
      </div>
      ${editable}
      ${rows}
    </dl>
    ${issues ? `<div class="detail-sec"><div class="detail-k">问题反馈</div>${issues}</div>` : ''}
    ${kidsHtml}
    ${sessionMarkup(p, n)}

    <div class="detail-sec">
      <div class="detail-k">Prompt 模板 · 点复制直接粘给模型<span class="psrc">${tasks.from}</span></div>
      <div class="prompt-list">
        ${tasks.list.map(t => `<div class="prow" data-task="${t.id}">
          <button class="ptitle" data-preview-prompt="${t.id}" data-nid="${n.id}" data-proj="${p.id}">${esc(t.title)}</button>
          <button class="pbtn" data-copy-prompt="${t.id}" data-nid="${n.id}" data-proj="${p.id}" title="复制完整 prompt">复制</button>
          <button class="pbtn run" data-prompt-run="${t.id}" data-nid="${n.id}" data-proj="${p.id}" title="用这条 prompt 发起会话">发起</button>
        </div>`).join('')}
      </div>
      <div class="pgen-wrap" id="pgen-wrap" hidden>
        <textarea class="pgen-input" id="pgen-input" spellcheck="false"></textarea>
        <div class="pgen-bar">
          <span class="pgen-hint" id="pgen-hint">点模板名展开，可直接改；「发起」会带上改过的内容</span>
          <button class="pbtn" data-pgen-reset="1">重置</button>
        </div>

  if (c0){ c0.style.opacity = ''; c0.style.transform = ''; }

function openDetail(id, skipEnsure){
  if (!skipEnsure) ensureVisible(id);
  return _openDetail(id);
}
function _openDetail(id){
  const p = findProjectByNode(id); if (!p) return;
  const n = findNode(p.root, id); if (!n) return;
  const anchor = document.querySelector(`.tnode[data-nid="${id}"]`);
  if (!anchor) return;
  const d = $('#detail'), card = d.querySelector('.detail-card');
  card.innerHTML = detailMarkup(p, n);
  d.hidden = false;
  document.querySelectorAll('.tnode.is-active').forEach(el => el.classList.remove('is-active'));
  anchor.classList.add('is-active');
  detailNode = id;
  // 同步测量 + 定位（不依赖 RAF），再用 RAF 触发入场动画，另加定时兜底
  const ar = anchor.getBoundingClientRect();
  const W = card.offsetWidth, H = card.offsetHeight;
  let left = ar.right + 10;
  if (left + W > innerWidth - 12) left = ar.left - W - 10;
  if (left < 12) left = Math.max(12, Math.min(innerWidth - W - 12, ar.left));
  let top = ar.top - 6;
  if (top + H > innerHeight - 12) top = Math.max(12, innerHeight - H - 12);
  card.style.left = left + 'px';
  card.style.top = top + 'px';
  card.style.transformOrigin = left > ar.right ? '0 26px' : '100% 26px';
  restorePgen(p, n);
  const showIt = () => {
    if (detailNode !== id) return;
    d.dataset.show = 'true';
    // 显式落终态：不依赖 CSS transition 是否被浏览器推进（无头/后台标签页下可能不推进）
    card.style.opacity = '1';
    card.style.transform = 'scale(1)';
    // 兜底：某些环境（无头截图 / 后台标签页）CSS transition 时钟不推进，
    // 计算值会一直停在 opacity:0 —— 220ms 后直接落终态（真实浏览器此时动画早已结束，无感）
    setTimeout(() => {
      if (detailNode !== id) return;
      card.style.transition = 'none';
      card.style.opacity = '1';
      card.style.transform = 'scale(1)';
    }, 220);
  };
  requestAnimationFrame(showIt);
  setTimeout(showIt, 48);
}

function startEdit(field, anchor){
  const row = anchor.closest('.detail-row');
  if (!row) return;
  const nid = row.dataset.nid, pid = row.dataset.proj;
  const p0 = PROJECTS.find(x => x.id === pid), n0 = p0 && findNode(p0.root, nid);
  const val = n0 && n0.raw ? (n0.raw[field] || '') : '';
  const dd = row.querySelector('dd');
  const multiline = field === 'acceptance' || field === 'verify' || field === 'approach' || field === 'proof' || field === 'intent';
  dd.innerHTML = `${multiline
      ? `<textarea class="dfield" rows="${field === 'proof' ? 2 : 2}" placeholder="${FIELD_LABEL[field]}…">${esc(val)}</textarea>`
      : `<input class="dfield" type="text" value="${esc(val)}" placeholder="${FIELD_LABEL[field]}…">`}
    <div class="dedit">
      <button class="tbtn primary-converge" data-save-edit="1">保存</button>
      <button class="tbtn" data-cancel-edit="1">取消</button>
      <span class="dedit-hint">⌘/Ctrl+Enter 保存 · Esc 取消</span>
    </div>`;
  const input = dd.querySelector('.dfield');
  input.focus();
  input.select && input.select();
  const commit = () => {
    const v = input.value.trim();
    n0.raw[field === 'title' ? 'title' : field] = v;
    if (field === 'title') n0.title = v;
    persist(p0).then(res => {
      if (!res.ok){
        toast('保存失败：' + res.error);
      } else if (res.warnings && res.warnings.length){
        toast('已保存（有警告：' + res.warnings[0] + '）');
      } else {
        toast(`已保存「${FIELD_LABEL[field] || field}」`);
      }
      render();
    });
  };
  dd.querySelector('[data-save-edit]').addEventListener('click', commit);
  dd.querySelector('[data-cancel-edit]').addEventListener('click', () => openDetail(nid));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); openDetail(nid); }
  });
}

let launchCtx = null;   // { p, n, tasks, selected }
function openLaunch(opts){
  const id = (opts && opts.nodeId) || detailNode;
  if (!id) return;
  const p = findProjectByNode(id); const n = p && findNode(p.root, id);
  if (!p || !n) return;
  const tasks = taskListFor(p, n).list;
  if (!tasks.length) return toast('这个节点没有可用的 prompt 模板');
  const preset = (opts && opts.taskId) || (tasks[0] && tasks[0].id);
  launchCtx = { p, n, tasks, selected: preset, edited: false };
  if (!RUN_CFG){ toast('服务未连接：无法发起会话'); return; }

  $('#launch-title').textContent = `${opts && opts.mode === 'edit' ? '修改 prompt' : '发起会话'} · ${KIND[n.kind]}「${n.title}」`;
  $('#launch-body').innerHTML = `
    <div class="detail-k" style="margin-bottom:5px">用哪条模板</div>
    <div class="lsel">${tasks.map(t => `<label class="lopt"><input type="radio" name="ltask" value="${t.id}" ${t.id===preset?'checked':''}>
      <span>${esc(t.title)}</span></label>`).join('')}</div>

      <span class="psrc" id="launch-edited" hidden>已手动修改</span></div>
