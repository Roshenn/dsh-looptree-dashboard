    <div class="mnote" style="margin-top:8px">工作目录 <span class="mono">${esc((p.card && p.card.project && p.card.project.workspace) || '')}</span></div>
    ${RUN_CFG.hasApiKey === false ? `<div class="mnote" style="color:var(--amber)">⚠ 运行器没拿到模型凭据（服务进程环境里没有 DEEPSEEK_API_KEY），现在发起大概率会失败。用 <code>DEEPSEEK_API_KEY=… node serve.mjs</code> 启动服务即可。</div>` : ''}
    <div class="mnote">会真实调用模型并按 headless profile 执行，可能需要一两分钟。同一节点同时只允许一个会话，并发上限 ${RUN_CFG.maxConcurrent}。</div>`;

  const ta = $('#launch-prompt');
  const fill = () => {
    const t = tasks.find(x => x.id === launchCtx.selected) || tasks[0];
    ta.value = composePrompt(p, n, t);
    launchCtx.edited = false;
    const badge = $('#launch-edited'); if (badge) badge.hidden = true;
  };
  fill();

    const badge = $('#launch-edited'); if (badge) badge.hidden = false;

    const badge = $('#launch-edited'); if (badge) badge.hidden = false;
  });
  $('#launch-body').querySelectorAll('input[name=ltask]').forEach(r => r.addEventListener('change', () => {
    launchCtx.selected = r.value; fill();
  }));

  const m = $('#launch');
  showModal(m);
  requestAnimationFrame(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); });
}
function closeLaunch(){ hideModal($('#launch')); }
async function doLaunch(){
  if (!launchCtx || !RUN_CFG) return;
  const { p, n, tasks, selected } = launchCtx;
  const ta = $('#launch-prompt');
  const prompt = (ta && ta.value || '').trim();
  if (!prompt) return toast('prompt 是空的');
  const task = tasks.find(x => x.id === selected) || tasks[0];
  closeLaunch();
  toast('会话启动中…');
  try {
    const res = await fetch(api('/run'), {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-rotation-token': RUN_CFG.token },
      body: JSON.stringify({ file: p.file, nodeId: n.id, prompt, taskId: task && task.id }),
    });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
    if (j.run) runMap.set(j.run.key, j.run);
    paintRunBadges(); refreshRuns();
    if (detailNode === n.id) openDetail(n.id);
    toast('会话已启动');
  } catch (e) {
    toast('发起失败：' + e.message);
  }
}

async function persist(p){
  if (!p.card) return { ok:false, error:'没有可写回的 card' };
  p.card.updated = new Date().toISOString();
  if (!p.file || !location.protocol.startsWith('http')){
    markSave('未连接保存服务 · 用「导出 JSON」保存', 'warn');
    return { ok:false, error:'未连接保存服务' };
  }
  try {
    const res = await fetch(api('/cards/') + encodeURIComponent(p.file), {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ card: p.card }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status) + (j.errors ? '：' + j.errors[0] : ''));
    markSave(`已写入 ${p.file} · ${new Date().toLocaleTimeString('sv-SE')}`, 'ok');
    return { ok:true, warnings: j.warnings || [] };
  } catch (e) {
    markSave('写入失败：' + e.message, 'err');
    return { ok:false, error:e.message };
  }
}
function exportCard(p){
  const p0 = p || PROJECTS.find(x => x.id === state.focusId) || PROJECTS[0];
  if (!p0 || !p0.card) return toast('当前泳道没有可导出的 card');
  const blob = new Blob([JSON.stringify(p0.card, null, 1) + '\n'], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = p0.file || `${p0.id}.rotation.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`已导出 ${a.download}`);
}

    }
  }
  if (!PROJECTS.some(p => p.id === state.focusId)) state.focusId = PROJECTS[0] ? PROJECTS[0].id : '';
  document.documentElement.dataset.theme = state.theme;
  render();
  const src = $('#data-src');
  if (src) src.textContent = source === 'server'
    ? '数据源：项目 .dsh/rotation.json（可写回）'
    : source === 'static' ? '数据源：cards.js（只读样例）' : '数据源：内置 mock';
  if (source !== 'server') markSave(`未连接 ${location.origin} 的保存服务 · 用「导出 JSON」保存（若 DSH 换过端口，请从当前地址重新打开面板）`, 'warn');
  else markSave('已连接：改动会写回项目 .dsh/rotation.json', 'ok');
  if (location.protocol.startsWith('http')){
    try {
      const r = await fetch(api('/run-config'));
      if (r.ok) RUN_CFG = await r.json();
    } catch {}
    if (RUN_CFG){
      await refreshRuns();
      await refreshServices();
      setInterval(() => { if (!document.hidden) refreshServices(); }, 5000);
      refreshTimer = setInterval(() => {
        // 后台标签页也要刷新：否则切回来看到的是旧状态；本地接口，代价可以忽略
        const busy = [...runMap.values()].some(x => x.status === 'running' || x.status === 'starting');
        if (busy || Math.random() < 0.2) refreshRuns();
      }, 2000);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        refreshRuns();
        refreshServices();
      });
    }
  }
  // 便于分享/截图：?open=<nodeId> 载入后直接展开该节点详情
  const openId = qs.get('open');
  if (openId) setTimeout(() => openDetail(openId), 250);
})();
</script>
</body>
</html>
